<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pagewise | Online Book Store</title>
<meta name="description" content="Buy books online. Cash on delivery, easy cancellation and 7-day returns.">
<meta name="theme-color" content="#141b34">
<link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
<link rel="icon" href="{{ url_for('static', filename='icon.svg') }}" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-192.png') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>.page.pad-buy{padding-bottom:104px}@media(min-width:900px){.page.pad-buy{padding-bottom:56px}}</style>
</head>
<body>
<a class="sr" href="#main">Skip to content</a>
<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="#/" aria-label="Pagewise home">
      <span class="brand-mark"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5a2 2 0 012-2h13v16H6a2 2 0 00-2 2V5z"/><path d="M4 19a2 2 0 012-2h13"/></svg></span>Pagewise
    </a>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <form class="top-search" id="topSearch" role="search" data-form="search">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input type="search" name="q" placeholder="Search title, author or ISBN" aria-label="Search books" autocomplete="off">
    </form>
    <div class="top-actions" id="topActions"></div>
  </div>
</header>
<main id="main" class="page" tabindex="-1"><noscript>Please turn on JavaScript to use the store.</noscript></main>
<div class="footer">Pagewise demo store. Cash on delivery only.</div>
<nav class="tabbar" id="tabbar" aria-label="Main"></nav>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="modalRoot"></div>
<script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
